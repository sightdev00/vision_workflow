validation:
  repository_checks:
    - "local_path必须解析为Git仓库根目录。"
    - "commit必须存在且为commit对象。"
    - "branch必须存在，并确认是否包含指定commit。"

  source_checks:
    - "path必须存在于repository指定的commit中。"
    - "role必须由源码、构建文件或调用关系支持。"
    - "status从pending-validation变更前必须记录验证证据。"
    - "selective-migration条目必须先完成职责、依赖、平台耦合和测试能力审计。"
    - "external-dependency条目必须明确版本、获取方式、许可证和封装策略。"

migration_rules:
  - "旧仓库默认只读，不直接修改。"
  - "本Manifest不直接决定新仓库的目标目录。"
  - "先生成组件职责与依赖审计，再生成迁移映射。"
  - "迁移映射经人工确认后，Agent才可创建目标目录或迁移代码。"
  - "每项迁移必须记录来源repository、commit和path。"
  - "平台专用实现不得直接成为公共接口。"
  - "第三方依赖不得按自有基础库方式直接复制和维护。"